<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; worker-src blob:; child-src blob:; connect-src 'self' file: data: blob:">
  <title>Simulateur de séismes — France</title>
  <link rel="stylesheet" href="../node_modules/maplibre-gl/dist/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div id="cards"></div>
      <div id="history-wrap">
        <div class="section-title"><span data-i18n="history"></span> <button id="clear-history" class="link-btn" data-i18n="clear"></button></div>
        <div id="history"></div>
      </div>
    </aside>

    <main id="stage">
      <div id="map"></div>

      <nav id="tabs">
        <button data-view="info" data-i18n-title="viewInfo">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>
        </button>
        <button data-view="realtime" class="on" data-i18n-title="viewRealtime">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M2 13h4l3-8 4 15 3-9 2 2h4"/></svg>
        </button>
        <button data-view="tsunami" data-i18n-title="viewTsunami">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M12 3L2 20h20z"/><path d="M6 16c2 0 2-2 4-2s2 2 4 2 2-2 4-2"/></svg>
        </button>
        <button id="btn-settings" data-i18n-title="settings">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>
        </button>
      </nav>

      <div id="clock"><span id="clock-date"></span> <span id="clock-time"></span> <span id="clock-tag"></span></div>

      <div id="zoom">
        <button id="btn-labels" data-i18n-title="markers">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M3 3l18 18"/></svg>
        </button>
        <button id="btn-zin" data-i18n-title="zoomIn">+</button>
        <button id="btn-zout" data-i18n-title="zoomOut">−</button>
        <button id="btn-fit" data-i18n-title="fit">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        </button>
      </div>

      <div id="legend"></div>

      <section id="setup" class="panel">
        <header>
          <h2 data-i18n="newQuakeTitle"></h2>
          <button class="icon-btn" id="setup-close">&times;</button>
        </header>
        <p class="hint" data-i18n="setupHint"></p>
        <label class="field">
          <span data-i18n="preset"></span>
          <select id="preset"><option value="" data-i18n="custom"></option></select>
        </label>
        <div class="field-row">
          <div class="kv"><span data-i18n="epicenter"></span><b id="setup-place">—</b></div>
          <div class="kv"><span data-i18n="latlon"></span><b id="setup-coords">—</b></div>
        </div>
        <label class="field">
          <span><span data-i18n="magnitude"></span> <b id="mag-val">5.0</b></span>
          <input type="range" id="mag" min="2" max="20" step="0.1" value="5.0">
        </label>
        <label class="field">
          <span><span data-i18n="depth"></span> <b id="depth-val">10 km</b></span>
          <input type="range" id="depth" min="0" max="60" step="1" value="10">
        </label>
        <button id="start" class="primary" disabled data-i18n="start"></button>
      </section>

      <section id="settings" class="panel" hidden>
        <header>
          <h2 data-i18n="settings"></h2>
          <button class="icon-btn" id="settings-close">&times;</button>
        </header>
        <label class="field">
          <span data-i18n="language"></span>
          <select id="lang">
            <option value="fr">Français</option>
            <option value="en">English</option>
          </select>
        </label>
        <label class="field">
          <span data-i18n="scale"></span>
          <select id="scale">
            <option value="ems" data-i18n="scaleEms"></option>
            <option value="jma" data-i18n="scaleJma"></option>
          </select>
        </label>
        <label class="field">
          <span><span data-i18n="volume"></span> <b id="vol-val">70%</b></span>
          <input type="range" id="volume" min="0" max="100" step="1" value="70">
        </label>
        <label class="check"><input type="checkbox" id="speech"> <span data-i18n="speech"></span></label>
        <label class="check"><input type="checkbox" id="eew" checked> <span data-i18n="eewToggle"></span></label>
        <label class="check"><input type="checkbox" id="autoswitch" checked> <span data-i18n="autoswitch"></span></label>
        <label class="check"><input type="checkbox" id="follow" checked> <span data-i18n="follow"></span></label>
        <label class="check"><input type="checkbox" id="lowpower"> <span data-i18n="lowpower"></span></label>
        <div class="field">
          <span data-i18n="sounds"></span>
          <div id="sound-slots"></div>
          <input type="file" id="sound-file" accept="audio/*" hidden>
        </div>
        <p class="hint" data-i18n="disclaimer"></p>
      </section>

      <div id="playback">
        <button id="play" class="icon-btn big" data-i18n-title="play">
          <svg id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <svg id="icon-pause" viewBox="0 0 24 24" hidden><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
        </button>
        <button id="replay" class="icon-btn" data-i18n-title="replay">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
        </button>
        <button id="reset" class="icon-btn" data-i18n-title="resetSim">
          <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
        </button>
        <span id="elapsed">--:--</span>
        <input type="range" id="timeline" min="-5" max="120" step="0.1" value="-5" disabled>
        <div id="speeds">
          <button data-speed="1" class="on">1×</button>
          <button data-speed="2">2×</button>
          <button data-speed="4">4×</button>
          <button data-speed="8">8×</button>
        </div>
        <button id="new-quake" class="primary small" data-i18n="newQuake"></button>
      </div>

      <div id="toast"></div>
    </main>
  </div>

  <script src="../node_modules/maplibre-gl/dist/maplibre-gl.js"></script>
  <script type="module" src="ui/app.js"></script>
</body>
</html>
